backend:
  name: github
  repo: yaqub0r/al-isabah
  branch: main
  base_url: https://dev.sabiqah.org
  auth_endpoint: api/decap/auth
  open_authoring: true

publish_mode: editorial_workflow
media_folder: evidence/uploads
public_folder: /evidence/uploads

collections:
  - name: review_proposals
    label: Review proposals
    folder: content/review-proposals
    create: true
    extension: json
    format: sabiqah-proposal-json
    slug: "review-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    identifier_field: proposal
    summary: "Review proposal {{filename}}"
    fields:
      - { name: proposal, label: Validated proposal, widget: sabiqah-proposal }
