name: Cloudflare infrastructure plan

on:
  pull_request:
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/infra-plan.yml"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to verify with a no-drift plan (never applies)
        required: true
        type: choice
        default: development
        options:
          - development
          - production

permissions:
  contents: read

concurrency:
  group: cloudflare-infra-plan-${{ github.ref }}-${{ inputs.environment || 'development' }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan private R2 infrastructure
    if: github.event_name == 'pull_request' || inputs.environment != 'production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'development' }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.5

      - name: Verify required configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID}"
          test -n "${AWS_SECRET_ACCESS_KEY}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${TF_VAR_cloudflare_account_id}"

      - name: Configure remote state endpoint
        shell: bash
        run: |
          set -euo pipefail
          sed "s/<CLOUDFLARE_ACCOUNT_ID>/${TF_VAR_cloudflare_account_id}/" \
            infra/cloudflare/backend.hcl.example > "${RUNNER_TEMP}/backend.hcl"

      - name: Initialize remote state
        working-directory: infra/cloudflare
        run: tofu init -input=false -backend-config="${RUNNER_TEMP}/backend.hcl"

      - name: Create speculative plan
        working-directory: infra/cloudflare
        shell: bash
        env:
          REQUIRE_NO_DRIFT: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          result=0
          tofu plan -input=false -lock-timeout=5m -no-color -detailed-exitcode || result=$?
          if [[ "${result}" == "2" && "${REQUIRE_NO_DRIFT}" == "true" ]]; then
            echo "::error::Credential verification found infrastructure drift. No changes were applied."
            exit 1
          fi
          if [[ "${result}" != "0" && "${result}" != "2" ]]; then
            exit "${result}"
          fi
