name: Cloudflare credential smoke test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing the token to test
        required: true
        type: choice
        default: development
        options:
          - development
          - production

permissions:
  contents: read

concurrency:
  group: cloudflare-credential-smoke-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  test-r2-access:
    name: Test R2 API access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Verify configured environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_API_TOKEN}"

      - name: List R2 buckets
        shell: bash
        run: |
          set -euo pipefail
          status="$({ curl --silent --show-error \
            --output response.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets"; } 2>curl-error.txt)"

          if [[ "${status}" != "200" ]] || ! jq -e '.success == true' response.json >/dev/null; then
            echo "R2 API check failed with HTTP ${status}." >&2
            jq -c '{success, errors}' response.json >&2 || true
            cat curl-error.txt >&2
            exit 1
          fi

          echo "R2 API authentication succeeded."
