name: Ingest Al-Isabah public distribution

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional immutable Al-Isabah public-working release tag
        required: false
        type: string
  repository_dispatch:
    types:
      - al-isabah-public-distribution

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: sabiqah-al-isabah-distribution-development
  cancel-in-progress: false

jobs:
  ingest:
    name: Validate, publish, verify, and activate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: development
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AL_ISABAH_PUBLIC_CORPUS_ROOT_URI: ${{ vars.AL_ISABAH_PUBLIC_CORPUS_ROOT_URI }}

    steps:
      - name: Check out Sabiqah
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve and download immutable Al-Isabah bundle
        env:
          REQUESTED_TAG: ${{ inputs.release_tag || github.event.client_payload.release_tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG}"
          if [[ -z "${tag}" ]]; then
            tag="$(gh release list --repo yaqub0r/al-isabah --limit 100 \
              --json tagName,isPrerelease,publishedAt \
              --jq '[.[] | select(.isPrerelease and (.tagName | startswith("public-working-")))] | sort_by(.publishedAt) | last | .tagName')"
          fi
          test -n "${tag}"
          if [[ ! "${tag}" =~ ^public-working-[a-f0-9]{40}$ ]]; then
            echo "::error::Release tag does not identify an immutable public-working commit."
            exit 1
          fi
          mkdir -p .runtime/distribution-download
          gh api "repos/yaqub0r/al-isabah/releases/tags/${tag}" > .runtime/release-metadata.json
          gh api "repos/yaqub0r/al-isabah/git/ref/tags/${tag}" > .runtime/tag-ref.json
          commit="${tag#public-working-}"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/yaqub0r/al-isabah/contents/compliance/rights-matrix.al-isabah.v1.json?ref=${commit}" \
            > .runtime/rights-matrix.json
          gh release download "${tag}" --repo yaqub0r/al-isabah \
            --pattern "al-isabah-public-distribution-${commit}.zip" \
            --dir .runtime/distribution-download
          archive=".runtime/distribution-download/al-isabah-public-distribution-${commit}.zip"
          test -n "${archive}"
          python3 scripts/extract_al_isabah_distribution.py \
            "${archive}" .runtime/al-isabah-distribution
          python3 scripts/verify_al_isabah_distribution.py \
            --distribution .runtime/al-isabah-distribution \
            --archive "${archive}" \
            --release-metadata .runtime/release-metadata.json \
            --tag-ref .runtime/tag-ref.json \
            --rights-matrix .runtime/rights-matrix.json \
            --source-authority evidence/source-authorities/al-isabah.v1.json

      - name: Resolve active immutable base corpus
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${AL_ISABAH_PUBLIC_CORPUS_ROOT_URI}"
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          root_uri="${AL_ISABAH_PUBLIC_CORPUS_ROOT_URI%/}"
          if [[ "${root_uri}" != "s3://sabiqah-assets-dev/public-corpora/al-isabah" ]]; then
            echo "::error::Unexpected Al-Isabah public-corpus root: ${root_uri}"
            exit 1
          fi
          bucket_uri="${root_uri%%/public-corpora/*}"
          pointer_uri="${root_uri}/current.json"
          aws s3 cp "${pointer_uri}" .runtime/current.json \
            --endpoint-url "${endpoint}" --no-cli-pager --no-progress --only-show-errors
          active_prefix="$(python3 scripts/resolve_al_isabah_distribution.py .runtime/current.json)"
          base_uri="${bucket_uri}/${active_prefix}/"
          aws s3 cp "${base_uri}" .runtime/base-corpus --recursive \
            --endpoint-url "${endpoint}" --no-cli-pager --no-progress --only-show-errors
          echo "CORPUS_ROOT_URI=${root_uri}" >> "${GITHUB_ENV}"
          echo "CORPUS_BUCKET_URI=${bucket_uri}" >> "${GITHUB_ENV}"

      - name: Resolve immutable legacy binding evidence
        run: |
          set -euo pipefail
          base_schema="$(python3 -c 'import json; print(json.load(open(".runtime/base-corpus/summary.json", encoding="utf-8"))["schemaVersion"])')"
          if [[ "${base_schema}" != "4.0.0" ]]; then
            exit 0
          fi
          mkdir -p .runtime/legacy-binding
          legacy_tag="public-working-af7e16223f7a2793101aa9f13e45c74c57ea0744"
          gh api "repos/yaqub0r/al-isabah/releases/tags/${legacy_tag}" \
            > .runtime/legacy-binding/release-metadata.json
          gh api "repos/yaqub0r/al-isabah/git/ref/tags/${legacy_tag}" \
            > .runtime/legacy-binding/tag-ref.json
          gh api "repos/yaqub0r/sabiqah/issues/125" \
            > .runtime/legacy-binding/approval-issue.json
          gh api "repos/yaqub0r/sabiqah/issues/comments/5305522508" \
            > .runtime/legacy-binding/approval-comment.json
          gh api "repos/yaqub0r/sabiqah/actions/runs/31910853487" \
            > .runtime/legacy-binding/activation-run.json

      - name: Ingest and validate complete reader corpus
        run: |
          set -euo pipefail
          python3 scripts/validate_public_corpus.py .runtime/base-corpus
          legacy_args=()
          base_schema="$(python3 -c 'import json; print(json.load(open(".runtime/base-corpus/summary.json", encoding="utf-8"))["schemaVersion"])')"
          if [[ "${base_schema}" == "4.0.0" ]]; then
            legacy_args=(
              --legacy-binding evidence/legacy-bindings/al-isabah-active-schema-4.v1.json
              --legacy-pointer .runtime/current.json
              --legacy-release-metadata .runtime/legacy-binding/release-metadata.json
              --legacy-tag-ref .runtime/legacy-binding/tag-ref.json
              --legacy-approval-issue .runtime/legacy-binding/approval-issue.json
              --legacy-approval-comment .runtime/legacy-binding/approval-comment.json
              --legacy-activation-run .runtime/legacy-binding/activation-run.json
            )
          fi
          activated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 scripts/ingest_al_isabah_distribution.py \
            --distribution .runtime/al-isabah-distribution \
            --base-corpus .runtime/base-corpus \
            --output .runtime/next-corpus \
            --activated-at "${activated_at}" \
            --archive .runtime/distribution-download/al-isabah-public-distribution-*.zip \
            --release-metadata .runtime/release-metadata.json \
            --tag-ref .runtime/tag-ref.json \
            --rights-matrix .runtime/rights-matrix.json \
            --source-authority evidence/source-authorities/al-isabah.v1.json \
            "${legacy_args[@]}"
          python3 scripts/validate_public_corpus.py .runtime/next-corpus
          corpus_id="$(python3 -c 'import json; print(json.load(open(".runtime/activation.json", encoding="utf-8"))["corpusId"])')"
          echo "NEXT_CORPUS_URI=${CORPUS_ROOT_URI}/${corpus_id}/" >> "${GITHUB_ENV}"

      - name: Upload or verify immutable R2 corpus
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if aws s3 ls "${NEXT_CORPUS_URI}manifest.json" \
            --endpoint-url "${endpoint}" --no-cli-pager >/dev/null 2>&1; then
            aws s3 cp "${NEXT_CORPUS_URI}" .runtime/verified-corpus --recursive \
              --endpoint-url "${endpoint}" --no-cli-pager --no-progress --only-show-errors
            diff --recursive --brief .runtime/next-corpus .runtime/verified-corpus
          else
            aws s3 cp .runtime/next-corpus "${NEXT_CORPUS_URI}" --recursive \
              --endpoint-url "${endpoint}" --no-cli-pager --no-progress --only-show-errors
            aws s3 cp "${NEXT_CORPUS_URI}" .runtime/verified-corpus --recursive \
              --endpoint-url "${endpoint}" --no-cli-pager --no-progress --only-show-errors
            python3 scripts/validate_public_corpus.py .runtime/verified-corpus
            diff --recursive --brief .runtime/next-corpus .runtime/verified-corpus
          fi

      - name: Activate only the verified corpus
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "${CORPUS_ROOT_URI}/current.json" .runtime/pre-activation-current.json \
            --endpoint-url "${endpoint}" --no-cli-pager --no-progress --only-show-errors
          activation_action="$(python3 scripts/prepare_al_isabah_activation.py \
            --expected-current .runtime/current.json \
            --observed-current .runtime/pre-activation-current.json \
            --proposed-activation .runtime/activation.json)"
          if [[ "${activation_action}" == "preserve" ]]; then
            echo "The intended immutable corpus is already active; preserving its activation and rollback pointer."
            exit 0
          fi
          if [[ "${activation_action}" != "activate" ]]; then
            echo "::error::Unknown activation action."
            exit 1
          fi
          aws s3 cp .runtime/activation.json "${CORPUS_ROOT_URI}/current.json" \
            --content-type application/json \
            --cache-control 'no-store' \
            --endpoint-url "${endpoint}" --no-cli-pager --no-progress --only-show-errors
          aws s3 cp "${CORPUS_ROOT_URI}/current.json" .runtime/verified-activation.json \
            --endpoint-url "${endpoint}" --no-cli-pager --no-progress --only-show-errors
          diff --brief .runtime/activation.json .runtime/verified-activation.json
