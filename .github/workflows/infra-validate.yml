name: Infrastructure validation

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/cloudflare-credential-smoke.yml"
      - ".github/workflows/infra-plan.yml"
      - ".github/workflows/infra-apply.yml"
      - ".github/workflows/r2-publisher-smoke.yml"
      - ".github/workflows/credential-expiry-reminders.yml"
      - "ops/credential-expirations.json"
      - "scripts/credential_expiry.py"
      - "tests/test_credential_expiry.py"
      - ".github/workflows/infra-validate.yml"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/cloudflare-credential-smoke.yml"
      - ".github/workflows/infra-plan.yml"
      - ".github/workflows/infra-apply.yml"
      - ".github/workflows/r2-publisher-smoke.yml"
      - ".github/workflows/credential-expiry-reminders.yml"
      - "ops/credential-expirations.json"
      - "scripts/credential_expiry.py"
      - "tests/test_credential_expiry.py"
      - ".github/workflows/infra-validate.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: OpenTofu validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.5

      - name: Check formatting
        run: tofu fmt -check -recursive

      - name: Validate credential expiry automation
        run: |
          python -m unittest discover -s tests -p "test_credential_expiry.py"
          python scripts/credential_expiry.py \
            ops/credential-expirations.json \
            --validate-only

      - name: Initialize providers without state
        working-directory: infra/cloudflare
        run: tofu init -backend=false -input=false

      - name: Validate configuration
        working-directory: infra/cloudflare
        run: tofu validate -no-color
