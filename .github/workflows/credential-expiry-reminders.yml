name: Credential expiry reminders

on:
  schedule:
    - cron: "23 13 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      mode:
        description: Run the expiry scan or send a delivery test
        required: true
        type: choice
        default: scan
        options:
          - scan
          - test

permissions:
  contents: read
  issues: write

concurrency:
  group: credential-expiry-reminders
  cancel-in-progress: false

jobs:
  remind:
    name: Notify credential owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate reminder logic
        run: |
          python -m unittest discover -s tests -p "test_credential_expiry.py"
          python scripts/credential_expiry.py \
            ops/credential-expirations.json \
            --validate-only

      - name: Send administrator delivery test
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        shell: bash
        run: |
          set -euo pipefail
          administrator="$(jq -r '.administrator' ops/credential-expirations.json)"
          title="[TEST] Credential rotation reminder delivery ${GITHUB_RUN_ID}"
          printf -v body '%s\n\n%s\n\n%s\n%s' \
            "@${administrator}, this is an end-to-end test of the Sabiqah credential-rotation reminder." \
            "Please confirm that this assignment and mention reached the administrative mailbox, then close this test issue." \
            "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "Rotation runbook: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/operations/credential-rotation.md"
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${title}" \
            --assignee "${administrator}" \
            --body "${body}"

      - name: Calculate expiry stages
        if: github.event_name == 'schedule' || inputs.mode == 'scan'
        run: |
          python scripts/credential_expiry.py \
            ops/credential-expirations.json \
            > "${RUNNER_TEMP}/credential-reminders.json"

      - name: Notify administrator
        if: github.event_name == 'schedule' || inputs.mode == 'scan'
        id: notify
        shell: bash
        run: |
          set -euo pipefail
          administrator="$(jq -r '.administrator' "${RUNNER_TEMP}/credential-reminders.json")"
          critical=false

          while IFS= read -r reminder; do
            credential_id="$(jq -r '.id' <<<"${reminder}")"
            credential_name="$(jq -r '.name' <<<"${reminder}")"
            environment="$(jq -r '.environment' <<<"${reminder}")"
            expires_on="$(jq -r '.expires_on' <<<"${reminder}")"
            days_remaining="$(jq -r '.days_remaining' <<<"${reminder}")"
            stage="$(jq -r '.stage' <<<"${reminder}")"
            is_critical="$(jq -r '.critical' <<<"${reminder}")"
            issue_title="Credential rotation: ${credential_name} expires ${expires_on}"
            marker="<!-- credential-expiry-stage:${credential_id}:${expires_on}:${stage} -->"

            issue_number="$(
              gh issue list \
                --repo "${GITHUB_REPOSITORY}" \
                --state all \
                --limit 100 \
                --json number,title \
              | jq -r --arg title "${issue_title}" \
                  '.[] | select(.title == $title) | .number' \
              | head -n 1
            )"

            if [[ -z "${issue_number}" ]]; then
              printf -v body '%s\n\n%s\n%s\n%s\n%s\n\n%s\n\n%s' \
                "@${administrator}, credential rotation requires attention." \
                "- Credential: **${credential_name}**" \
                "- Environment: **${environment}**" \
                "- Expiration: **${expires_on}**" \
                "- Days remaining: **${days_remaining}**" \
                "Follow the [credential rotation runbook](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/operations/credential-rotation.md). Do not put credential values in this issue." \
                "${marker}"
              gh issue create \
                --repo "${GITHUB_REPOSITORY}" \
                --title "${issue_title}" \
                --assignee "${administrator}" \
                --body "${body}"
            else
              issue_json="$(gh issue view "${issue_number}" --repo "${GITHUB_REPOSITORY}" --json state,body,comments)"
              if [[ "$(jq -r '.state' <<<"${issue_json}")" == "CLOSED" ]]; then
                gh issue reopen "${issue_number}" --repo "${GITHUB_REPOSITORY}"
              fi
              if ! grep -Fq "${marker}" <<<"$(jq -r '[.body, (.comments[].body)] | join("\n")' <<<"${issue_json}")"; then
                gh issue comment "${issue_number}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --body "@${administrator}: **${credential_name}** has ${days_remaining} day(s) remaining before ${expires_on}. Follow the rotation runbook and update the manifest after verification and revocation. ${marker}"
              fi
            fi

            if [[ "${is_critical}" == "true" ]]; then
              critical=true
            fi
          done < <(jq -c '.reminders[]' "${RUNNER_TEMP}/credential-reminders.json")

          if [[ "${critical}" == "true" ]]; then
            echo "One or more credentials expire within 14 days or are overdue." >&2
            exit 1
          fi
