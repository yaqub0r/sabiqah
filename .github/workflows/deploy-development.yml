name: Deploy development application

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sabiqah-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy development
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      AL_ISABAH_PUBLIC_CORPUS_URI: ${{ vars.AL_ISABAH_PUBLIC_CORPUS_URI }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0

      - name: Activate the pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify required configuration
        env:
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          INVITE_CODE_DIGEST: ${{ secrets.INVITE_CODE_DIGEST }}
          INVITE_CODE_PEPPER: ${{ secrets.INVITE_CODE_PEPPER }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${PUBLIC_TURNSTILE_SITE_KEY}"
          test -n "${AL_ISABAH_PUBLIC_CORPUS_URI}"
          test -n "${GITHUB_CLIENT_ID}"
          test -n "${GITHUB_CLIENT_SECRET}"
          test -n "${INVITE_CODE_DIGEST}"
          test -n "${INVITE_CODE_PEPPER}"
          test -n "${SESSION_SECRET}"
          test -n "${TURNSTILE_SECRET_KEY}"
          test -n "${R2_ACCESS_KEY_ID}"
          test -n "${R2_SECRET_ACCESS_KEY}"

      - name: Validate the release candidate
        run: pnpm check

      - name: Download and verify pinned public working corpus
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp \
            "${AL_ISABAH_PUBLIC_CORPUS_URI}" \
            .runtime/al-isabah-public-corpus \
            --recursive \
            --endpoint-url "${endpoint}" \
            --no-cli-pager --no-progress --only-show-errors
          python3 scripts/validate_public_corpus.py .runtime/al-isabah-public-corpus
          REVIEW_CORPUS_PATH=.runtime/al-isabah-public-corpus \
            pnpm test -- packages/release-model/tests/generatedReviewCorpus.test.ts

      - name: Apply forward-only D1 migrations
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler.log
        run: pnpm exec wrangler d1 migrations apply DB --remote

      - name: Deploy Worker and static assets
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler.log
        run: pnpm exec wrangler deploy

      - name: Install runtime secrets
        env:
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          INVITE_CODE_DIGEST: ${{ secrets.INVITE_CODE_DIGEST }}
          INVITE_CODE_PEPPER: ${{ secrets.INVITE_CODE_PEPPER }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler.log
        run: |
          set -euo pipefail
          printf '%s' "${GITHUB_CLIENT_ID}" | pnpm exec wrangler secret put GITHUB_CLIENT_ID
          printf '%s' "${GITHUB_CLIENT_SECRET}" | pnpm exec wrangler secret put GITHUB_CLIENT_SECRET
          printf '%s' "${INVITE_CODE_DIGEST}" | pnpm exec wrangler secret put INVITE_CODE_DIGEST
          printf '%s' "${INVITE_CODE_PEPPER}" | pnpm exec wrangler secret put INVITE_CODE_PEPPER
          printf '%s' "${SESSION_SECRET}" | pnpm exec wrangler secret put SESSION_SECRET
          printf '%s' "${TURNSTILE_SECRET_KEY}" | pnpm exec wrangler secret put TURNSTILE_SECRET_KEY

      - name: Verify Worker health
        env:
          DEVELOPMENT_BASE_URL: ${{ vars.DEVELOPMENT_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "${DEVELOPMENT_BASE_URL}"
          curl --fail --retry 5 --retry-all-errors "${DEVELOPMENT_BASE_URL}/api/health"
          curl --fail --retry 5 --retry-all-errors \
            "${DEVELOPMENT_BASE_URL}/api/corpus/al-isabah/summary"

          expect_status() {
            local expected="$1"
            local url="$2"
            local method="${3:-GET}"
            local status=""

            for attempt in 1 2 3 4 5 6; do
              if ! status="$(curl --silent --show-error --output /dev/null \
                --connect-timeout 10 --max-time 10 --write-out '%{http_code}' \
                --request "${method}" "${url}")"; then
                status="request-error"
              fi
              if [ "${status}" = "${expected}" ]; then
                return 0
              fi
              if [ "${attempt}" -lt 6 ]; then
                sleep 5
              fi
            done

            echo "::error::Expected ${expected} from ${url}, received ${status}"
            return 1
          }

          expect_status 200 "${DEVELOPMENT_BASE_URL}/api/corpus/al-isabah/index"
          expect_status 200 "${DEVELOPMENT_BASE_URL}/api/corpus/al-isabah/reviews"
          expect_status 403 \
            "${DEVELOPMENT_BASE_URL}/api/corpus/al-isabah/reviews/isabah-entry-00010759" \
            POST
          expect_status 200 \
            "${DEVELOPMENT_BASE_URL}/api/corpus/al-isabah/sections/volume-08-pages-0001-0025"
