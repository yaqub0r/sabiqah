packages:
  - apps/*
  - packages/*
  - workers/*

overrides:
  # Decap 3.15 requests vulnerable legacy releases. Keep the audit green and
  # remove these only after the upstream dependency ranges are patched.
  immutable: 4.3.9
  trim: 0.0.3

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260811.1"
  - miniflare@5.20260804.0-alpha
  - wrangler@4.120.1
