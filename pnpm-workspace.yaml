packages:
  - apps/*
  - packages/*
  - workers/*

# Keep pnpm's linked dependency tree shallow enough for Windows tooling.
# This remains project-local and must not be shared between worktrees.
virtualStoreDir: .pnpm

overrides:
  # Decap still requests vulnerable legacy releases. Keep the audit green and
  # remove these only after the upstream dependency ranges are patched.
  brace-expansion@2.1.4: 2.1.7
  fast-uri: 3.1.8
  immutable: 4.3.9
  js-yaml@3.15.1: 3.15.2
  trim: 0.0.3

  # Astro and its React integration currently permit or pin these vulnerable
  # transitives. Keep each resolution within the package's existing major.
  devalue@5.9.0: 5.9.4
  http-cache-semantics: 4.3.0
  js-yaml@4.3.1: 4.3.2
  source-map-js@1.2.1: 1.2.2
  svgo@4.0.2: 4.1.0
  undici@8.10.0: 8.10.2

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260811.1"
  - miniflare@5.20260804.0-alpha
  - wrangler@4.120.1
